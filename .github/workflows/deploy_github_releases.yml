name: Publish APS binaries to GitHub Releases
on:
  push:
    tags:
      # A release and nothing else. An -sc tag is a release of this fork and is
      # built by deploy_sc_releases.yml, which publishes rather than drafts.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
    - name: Setup build environment
      uses: agrahn/android-password-store/.github/reusable-workflows/setup-gradle@8c172aa00e7ed769dda445d7834940c2b9094ed0 # develop
      with:
        java-version: 21

    - name: Decrypt secrets
      shell: bash
      run: scripts/signing-setup.sh "$ENCRYPT_KEY"
      env:
        ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}

    - name: Build release binaries
      shell: bash
      run: ./gradlew :app:assembleRelease

    - name: Upload release APK
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: APS Release APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Clean secrets
      if: "${{ always() }}"
      run: scripts/signing-cleanup.sh

  create_github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # Drafting the release and attaching the APK to it are both writes.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: APS Release APK
          path: artifacts

#      - name: Get Changelog Entry
#        id: changelog_reader
#        uses: mindsers/changelog-reader-action@32aa5b4c155d76c94e4ec883a223c947b2f02656 # v2.2.3
#        with:
#          version: ${{ github.ref }}
#          path: ./CHANGELOG.md

      # Drafted with the same tool the snapshot builds use, rather than the two
      # archived actions this used to call: they have not been touched since 2021
      # and now run on a Node the runners are dropping.
      - name: Draft the release with the APK attached
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mv artifacts/app-release.apk "artifacts/APS-${TAG}.apk"
          gh release create "${TAG}" \
            --draft \
            --title "${TAG}" \
            "artifacts/APS-${TAG}.apk"
