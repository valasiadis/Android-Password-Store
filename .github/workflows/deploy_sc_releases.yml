name: Publish APS sc builds to GitHub Releases
on:
  push:
    tags:
      # This fork's own releases: v2.1.0-sc.2 and the like. They are releases,
      # not rehearsals for one — published outright, and never marked
      # pre-release. A plain v2.1.0 belongs to upstream and is drafted by
      # deploy_github_releases.yml instead.
      - 'v[0-9]+.[0-9]+.[0-9]+-sc.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
    - name: Setup build environment
      uses: agrahn/android-password-store/.github/reusable-workflows/setup-gradle@8c172aa00e7ed769dda445d7834940c2b9094ed0 # develop
      with:
        java-version: 21

    # version.properties carries whatever version the branch is working towards,
    # which is not what a tagged build is. v2.0.0-sc.3 is upstream's 2.0.0 with
    # this fork's smartcard support, third revision, and that is what the app
    # should report — not the 2.1.0-SNAPSHOT the file happens to hold.
    #
    # The version code puts the sc revision in the last two digits below the
    # scheme the file already uses, so 2.0.0-sc.3 is 20000*100 + 3. It only ever
    # has to climb across this fork's own builds — the applicationId is the
    # fork's, so upstream's releases are a different app and never compete — and
    # it does: sc.4 follows sc.3, and a later 2.1.0-sc.1 (2010001) follows both.
    # It also clears the 20100 that sc.1 and sc.2 were built with by accident,
    # back when the version was read straight out of the file, so this installs
    # over them rather than being refused as a downgrade.
    - name: Set the version from the tag
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
      run: |
        VERSION="${TAG#v}"
        IFS=. read -r MAJOR MINOR PATCH _ <<< "${VERSION%%-*}"
        REVISION="${VERSION##*-sc.}"
        CODE=$(( (MAJOR * 10000 + MINOR * 100 + PATCH) * 100 + REVISION ))
        sed -i \
          -e "s/^versioning-plugin.versionName=.*/versioning-plugin.versionName=${VERSION}/" \
          -e "s/^versioning-plugin.versionCode=.*/versioning-plugin.versionCode=${CODE}/" \
          app/version.properties
        cat app/version.properties

    - name: Decrypt secrets
      shell: bash
      run: scripts/signing-setup.sh "$ENCRYPT_KEY"
      env:
        ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}

    - name: Build release binaries
      shell: bash
      run: ./gradlew :app:assembleRelease

    - name: Upload release APK
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: APS Release APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Clean secrets
      if: "${{ always() }}"
      run: scripts/signing-cleanup.sh

  create_github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # Creating the release and attaching the APK to it are both writes.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: APS Release APK
          path: artifacts

      - name: Publish the release with the APK attached
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mv artifacts/app-release.apk "artifacts/APS-${TAG}.apk"
          gh release create "${TAG}" \
            --title "${TAG}" \
            "artifacts/APS-${TAG}.apk"
